name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check no phone logs are committed
        run: |
          # Run logs hold what people said near the phone, and this repo is public.
          found=$(git ls-files 'phone-logs/*' '*.log')
          if [ -n "$found" ]; then echo "Phone logs must not be committed:"; echo "$found"; exit 1; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew lintDebug
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # One fixed debug key, so each new APK installs over the last one and keeps the logs on the phone.
      - name: Use the shared debug key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::warning::DEBUG_KEYSTORE_B64 is not set, the APK gets a new random debug key"
            exit 0
          fi
          mkdir -p ~/.android
          base64 -d <<< "$DEBUG_KEYSTORE_B64" > ~/.android/debug.keystore
      - run: ./gradlew assembleDebug
      - name: Check the APK has no INTERNET permission
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          perms="$("$aapt2" dump permissions app/build/outputs/apk/debug/app-debug.apk)"
          echo "$perms"
          if grep -q "android.permission.INTERNET" <<< "$perms"; then
            echo "::error::The APK requests the INTERNET permission"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: outspoken-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
